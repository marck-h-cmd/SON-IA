[project]
name = "son-ia-backend"
version = "0.1.0"
description = "SON-IA: Sinergia Operativa del Negocio - Integratel Agéntica"
requires-python = ">=3.11"
authors = [
    {name = "Integratel", email = "dev@integratel.com"}
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"