version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: son-ia-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: son_ia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: son-ia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: son-ia-backend
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - default
      - openwa
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - ./DATASET:/DATASET
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: son-ia-celery
    user: "${UID:-1000}:${GID:-1000}"
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - PYTHONDONTWRITEBYTECODE=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - default
      - openwa
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
      - backend
    volumes:
      - ./backend:/app
    restart: unless-stopped

  flower:
    image: mher/flower:latest
    container_name: son-ia-flower
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: son-ia-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: son-ia_default
  # Red del gateway WhatsApp (OpenWA). Debe existir: la crea el stack OpenWA.
  openwa:
    external: true
    name: openwa-network
